name: Release

# Cutting a release is a tag push. The tag must match the repository-root
# VERSION file, so a mistyped tag fails before anything is published.
#
# The release is created as a DRAFT: the operator reviews the artifact and the
# notes, then publishes it by hand. Nothing here publishes on its own.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Resolve release version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "artifact=creative-ai-studio-v${version}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pushed="${GITHUB_REF#refs/tags/}"
          expected="${{ steps.version.outputs.tag }}"
          if [[ "${pushed}" != "${expected}" ]]; then
            echo "::error::tag ${pushed} does not match VERSION (${expected}). Update VERSION or retag." >&2
            exit 1
          fi
          echo "tag ${pushed} matches VERSION"

      - name: Build release artifact
        run: ./scripts/build_release_artifact.sh

      - name: Upload artifact to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            artifacts/${{ steps.version.outputs.artifact }}
            artifacts/SHA256SUMS
            artifacts/artifact-manifest.txt
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          # A version with a pre-release suffix (1.0.0-rc.1) is a release
          # candidate, so mark it as one instead of letting it look like a
          # finished release once the draft is published.
          args=(
            --draft
            --title "${TAG}"
            --notes "See CHANGELOG.md for the contents of this release. Verify the download against SHA256SUMS before installing."
          )
          if [[ "${TAG}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}" \
            "artifacts/${ARTIFACT}" \
            "artifacts/SHA256SUMS"
